openapi: 3.2.0
info:
  version: 1.5.0
  title: Coda Pages API
  license:
    name: Coda Developer Terms
    url: https://coda.io/trust/developer
  description: '# Introduction


    The Coda API is a RESTful API that lets you programmatically interact with Coda docs:


    * List and search Coda docs

    * Create new docs and copy existing ones

    * Share and publish docs

    * Discover pages, tables, formulas, and controls

    * Read, insert, upsert, update, and delete rows


    If you plan to integrate Coda with an AI tool, you may also want to consider using the

    Coda MCP server.'
  termsOfService: https://coda.io/trust/tos
  contact:
    name: API Support
    url: https://coda.io
    email: help+api@coda.io
  x-logo:
    url: https://cdn.coda.io/external/img/apilogo.png
    backgroundColor: transparent
    altText: Coda API
    href: '#'
servers:
- url: https://coda.io/apis/v1
  description: Coda API (v1)
security:
- Bearer: []
tags:
- name: Pages
  description: Pages in Coda offer canvases containing rich text, tables, controls, and other objects. At this time, this API lets you list and access pages in a doc.
paths:
  /docs/{docId}/pages:
    get:
      summary: List pages
      description: Returns a list of pages in a Coda doc.
      operationId: listPages
      tags:
      - Pages
      parameters:
      - $ref: '#/components/parameters/docId'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/pageToken'
      responses:
        '200':
          description: List of pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageList'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: 'import requests


          headers = {''Authorization'': ''Bearer <your API token>''}

          uri = f''https://coda.io/apis/v1/docs/<doc ID>/pages''

          res = requests.get(uri, headers=headers).json()


          print(f''The name of the first page is {res["items"][0]["name"]}'')

          # => The name of the first page is Page 1

          '
      - label: Shell
        lang: shell
        source: "curl -s -H 'Authorization: Bearer <your API token>' \\\n  'https://coda.io/apis/v1/docs/<doc ID>/pages' |\n  jq '.items[0].name'\n# => \"Page 1\"\n"
      - label: Google Apps Script
        lang: javascript
        source: '// Import the CodaAPI library via Resource->Libraries...:

          // 15IQuWOk8MqT50FDWomh57UqWGH23gjsWVWYFms3ton6L-UHmefYHS9Vl

          CodaAPI.authenticate(''<your API token>'');

          var pages = CodaAPI.listPages(''<doc ID>'').items;

          Logger.log(''The name of the first page is '' + pages[0].name);

          // => The name of the first page is Page 1

          '
    post:
      summary: Create a page
      description: Create a new page in a doc. Note that creating a page requires you to be a Doc Maker in the applicable workspace.
      operationId: createPage
      tags:
      - Pages
      parameters:
      - $ref: '#/components/parameters/docId'
      requestBody:
        description: Parameters for creating a page.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageCreate'
      responses:
        '202':
          description: A result indicating that the creation request was queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCreateResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: "import requests\n\nheaders = {'Authorization': 'Bearer <your API token>'}\nuri = f'https://coda.io/apis/v1/docs/<doc ID>/pages'\npayload = {\n  'name': 'New Page Name',\n}\nreq = requests.post(uri, headers=headers, json=payload)\nreq.raise_for_status() # Throw if there was an error.\nres = req.json()\n\nprint(f'Created page {res[\"id\"]}')\n# => Created page <page ID>\n"
      - label: Shell
        lang: shell
        source: "curl -s -H 'Authorization: Bearer <your API token>' -X POST -H \"Content-Type: application/json\" \\\n  -d '{\"name\": \"New Page Name\"}' \\\n  'https://coda.io/apis/v1/docs/<doc ID>/pages' |\n  jq '\"Created page \" + .id'\n# => \"Created page <page ID>\"\n"
      - label: Google Apps Script
        lang: javascript
        source: '// Import the CodaAPI library via Resource->Libraries...:

          // 15IQuWOk8MqT50FDWomh57UqWGH23gjsWVWYFms3ton6L-UHmefYHS9Vl

          CodaAPI.authenticate(''<your API token>'');

          var res = CodaAPI.createPage(<doc ID>, {name: "New Page Name"});

          Logger.log(''Created page '' + res.id);

          // => Created page <page ID>

          '
  /docs/{docId}/pages/{pageIdOrName}:
    get:
      summary: Get a page
      description: Returns details about a page.
      operationId: getPage
      tags:
      - Pages
      parameters:
      - $ref: '#/components/parameters/docId'
      - $ref: '#/components/parameters/pageIdOrName'
      responses:
        '200':
          description: Info about a page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          $ref: '#/components/responses/GoneError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: 'import requests


          headers = {''Authorization'': ''Bearer <your API token>''}

          uri = f''https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>''

          res = requests.get(uri, headers=headers).json()


          print(f''The name of this page is {res["name"]}'')

          # => The name of this page is Page 1

          '
      - label: Shell
        lang: shell
        source: "curl -s -H 'Authorization: Bearer <your API token>' \\\n  'https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>' |\n  jq '.name'\n# => \"Page 1\"\n"
      - label: Google Apps Script
        lang: javascript
        source: '// Import the CodaAPI library via Resource->Libraries...:

          // 15IQuWOk8MqT50FDWomh57UqWGH23gjsWVWYFms3ton6L-UHmefYHS9Vl

          CodaAPI.authenticate(''<your API token>'');

          var page = CodaAPI.getPage(''<doc ID>'', ''<page ID>'');

          Logger.log(''The name of this page is '' + page.name);

          // => The name of this page is Page 1

          '
    put:
      summary: Update a page
      description: Update properties for a page. Note that updating a page title or icon requires you to be a Doc Maker in the applicable workspace.
      operationId: updatePage
      tags:
      - Pages
      parameters:
      - $ref: '#/components/parameters/docId'
      - $ref: '#/components/parameters/pageIdOrName'
      requestBody:
        description: Parameters for updating a page.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageUpdate'
      responses:
        '202':
          description: A result indicating that the update was queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUpdateResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: "import requests\n\nheaders = {'Authorization': 'Bearer <your API token>'}\nuri = f'https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>'\npayload = {\n  'name': 'New Page Name',\n}\nreq = requests.put(uri, headers=headers, json=payload)\nreq.raise_for_status() # Throw if there was an error.\nres = req.json()\n\nprint(f'Updated page {res[\"id\"]}')\n# => Updated page <page ID>\n"
      - label: Shell
        lang: shell
        source: "curl -s -H 'Authorization: Bearer <your API token>' -X PUT -H \"Content-Type: application/json\" \\\n  -d '{\"name\": \"New Page Name\"}' \\\n  'https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>' |\n  jq '\"Updated page \" + .id'\n# => \"Updated page <page ID>\"\n"
      - label: Google Apps Script
        lang: javascript
        source: '// Import the CodaAPI library via Resource->Libraries...:

          // 15IQuWOk8MqT50FDWomh57UqWGH23gjsWVWYFms3ton6L-UHmefYHS9Vl

          CodaAPI.authenticate(''<your API token>'');

          var res = CodaAPI.updatePage(<doc ID>, <page ID>, {name: "New Page Name"});

          Logger.log(''Updated page '' + res.id);

          // => Updated page <page ID>

          '
    delete:
      summary: Delete a page
      description: Deletes the specified page.
      operationId: deletePage
      tags:
      - Pages
      parameters:
      - $ref: '#/components/parameters/docId'
      - $ref: '#/components/parameters/pageIdOrName'
      responses:
        '202':
          description: A result indicating that the delete was queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDeleteResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: 'import requests


          headers = {''Authorization'': ''Bearer <your API token>''}

          uri = f''https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>''

          req = requests.delete(uri, headers=headers)

          req.raise_for_status() # Throw if there was an error.

          res = req.json()


          print(f''Deleted page'')

          # => Deleted page

          '
      - label: Shell
        lang: shell
        source: "curl -s -H 'Authorization: Bearer <your API token>' -X DELETE -H \"Content-Type: application/json\" \\\n  'https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>' |\n  jq 'if .statusMessage? == null then \"Deleted page\" else . end'\n# => \"Deleted pages\"\n"
      - label: Google Apps Script
        lang: javascript
        source: '// Import the CodaAPI library via Resource->Libraries...:

          // 15IQuWOk8MqT50FDWomh57UqWGH23gjsWVWYFms3ton6L-UHmefYHS9Vl

          CodaAPI.authenticate(''<your API token>'');

          CodaAPI.deleteRows(''<doc ID>'', ''<page ID>'');

          Logger.log(''Deleted 2 rows'');

          // => Deleted page

          '
  /docs/{docId}/pages/{pageIdOrName}/content:
    get:
      summary: List page content
      description: Returns a list of content elements in a page.
      operationId: listPageContent
      tags:
      - Pages
      parameters:
      - $ref: '#/components/parameters/docId'
      - $ref: '#/components/parameters/pageIdOrName'
      - $ref: '#/components/parameters/pageContentLimit'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/contentFormat'
      responses:
        '200':
          description: List of page content elements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContentList'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          $ref: '#/components/responses/GoneError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: 'import requests


          headers = {''Authorization'': ''Bearer <your API token>''}

          uri = f''https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>/content''

          res = requests.get(uri, headers=headers).json()


          print(f''The page has {len(res["items"])} content elements'')

          # => The page has 10 content elements

          '
      - label: Shell
        lang: shell
        source: "curl -s -H 'Authorization: Bearer <your API token>' \\\n  'https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>/content' |\n  jq '.items | length'\n# => 10\n"
      - label: Google Apps Script
        lang: javascript
        source: '// Import the CodaAPI library via Resource->Libraries...:

          // 15IQuWOk8MqT50FDWomh57UqWGH23gjsWVWYFms3ton6L-UHmefYHS9Vl

          CodaAPI.authenticate(''<your API token>'');

          var content = CodaAPI.listPageContent(''<doc ID>'', ''<page ID>'');

          Logger.log(''The page has '' + content.items.length + '' content elements'');

          // => The page has 10 content elements

          '
    delete:
      summary: Delete page content
      description: Delete content from a page. You can delete specific elements by providing their IDs, or delete all content from the page.
      operationId: deletePageContent
      tags:
      - Pages
      parameters:
      - $ref: '#/components/parameters/docId'
      - $ref: '#/components/parameters/pageIdOrName'
      requestBody:
        description: Parameters for deleting page content.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageContentDelete'
      responses:
        '202':
          description: A result indicating that the deletion was queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContentDeleteResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: 'import requests


          headers = {''Authorization'': ''Bearer <your API token>''}


          # Delete all content from the page

          uri = f''https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>/content''

          req = requests.delete(uri, headers=headers)

          req.raise_for_status()

          res = req.json()

          print(f''Deleted all content from page {res["id"]}'')

          # => Deleted all content from page <page ID>


          # Delete specific elements

          payload = {''elementIds'': [''cl-abc123'', ''cl-def456'']}

          req = requests.delete(uri, headers=headers, json=payload)

          req.raise_for_status()

          res = req.json()

          print(f''Deleted {len(payload["elementIds"])} elements from page {res["id"]}'')

          # => Deleted 2 elements from page <page ID>

          '
      - label: Shell
        lang: shell
        source: "# Delete specific elements\ncurl -s -H 'Authorization: Bearer <your API token>' -X DELETE \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"elementIds\": [\"cl-abc123\", \"cl-def456\"]}' \\\n  'https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>/content' |\n  jq '\"Deleted elements from page \" + .id'\n# => \"Deleted elements from page <page ID>\"\n"
      - label: Google Apps Script
        lang: javascript
        source: '// Import the CodaAPI library via Resource->Libraries...:

          // 15IQuWOk8MqT50FDWomh57UqWGH23gjsWVWYFms3ton6L-UHmefYHS9Vl

          CodaAPI.authenticate(''<your API token>'');


          // Delete all content

          var res = CodaAPI.deletePageContent(''<doc ID>'', ''<page ID>'');

          Logger.log(''Deleted all content from page '' + res.id);

          // => Deleted all content from page <page ID>

          '
  /docs/{docId}/pages/{pageIdOrName}/export:
    post:
      summary: Begin content export
      description: Initiate an export of content for the given page.
      operationId: beginPageContentExport
      tags:
      - Pages
      parameters:
      - $ref: '#/components/parameters/docId'
      - $ref: '#/components/parameters/pageIdOrName'
      requestBody:
        description: Parameters for requesting a page content export.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginPageContentExportRequest'
      responses:
        '202':
          description: Export page content response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeginPageContentExportResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          $ref: '#/components/responses/GoneError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: "import requests\n\nheaders = {'Authorization': 'Bearer <your API token>'}\nuri = f'https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>/export'\npayload = {\n  'outputFormat': 'html',\n}\nreq = requests.post(uri, headers=headers, json=payload)\nreq.raise_for_status() # Throw if there was an error.\nres = req.json()\n\nprint(f'Export status available at {res[\"href\"]}')\n# => Export status available at <status URL>\n"
      - label: Shell
        lang: shell
        source: "curl -s -H 'Authorization: Bearer <your API token>' -X POST -H \"Content-Type: application/json\" \\\n  -d '{\"outputFormat\": \"html\"}' \\\n  'https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>/export' |\n  jq '\"Export status available at \" + .href'\n# => Export status available at <status URL>\n"
      - label: Google Apps Script
        lang: javascript
        source: '// Import the CodaAPI library via Resource->Libraries...:

          // 15IQuWOk8MqT50FDWomh57UqWGH23gjsWVWYFms3ton6L-UHmefYHS9Vl

          CodaAPI.authenticate(''<your API token>'');

          var page = CodaAPI.beginPageContentExport(''<doc ID>'', ''<page ID>'', {outputFormat: ''html''});

          Logger.log(''Export status available at '' + page.href);

          // => Export status available at <status URL>

          '
  /docs/{docId}/pages/{pageIdOrName}/export/{requestId}:
    get:
      summary: Content export status
      description: Check the status of a page content export
      operationId: getPageContentExportStatus
      tags:
      - Pages
      parameters:
      - $ref: '#/components/parameters/docId'
      - $ref: '#/components/parameters/pageIdOrName'
      - $ref: '#/components/parameters/requestId'
      responses:
        '200':
          description: Info about the page content export request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContentExportStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          $ref: '#/components/responses/GoneError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: 'import requests


          headers = {''Authorization'': ''Bearer <your API token>''}

          uri = f''https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>/export/<request ID>''

          res = requests.get(uri, headers=headers).json()


          print(f''Request status: {res["status"]}'')

          # => Request status: completed

          '
      - label: Shell
        lang: shell
        source: "curl -s -H 'Authorization: Bearer <your API token>' \\\n  -d '{\"outputFormat\": \"html\"}' \\\n  'https://coda.io/apis/v1/docs/<doc ID>/pages/<page ID>/export/<request ID>' |\n  jq .status\n# => completed\n"
      - label: Google Apps Script
        lang: javascript
        source: '// Import the CodaAPI library via Resource->Libraries...:

          // 15IQuWOk8MqT50FDWomh57UqWGH23gjsWVWYFms3ton6L-UHmefYHS9Vl

          CodaAPI.authenticate(''<your API token>'');

          var response = CodaAPI.getPageContentExportStatus(''<doc ID>'', ''<page ID>'', ''<request ID>'');

          Logger.log(''Export status: '' + response.status);

          // => Export status: completed

          '
components:
  responses:
    GoneError:
      description: The resource has been deleted.
      content:
        application/json:
          schema:
            description: An HTTP error resulting from an unsuccessful request.
            required:
            - statusCode
            - statusMessage
            - message
            additionalProperties: false
            properties:
              statusCode:
                type: number
                description: HTTP status code of the error.
                example: 410
              statusMessage:
                type: string
                description: HTTP status message of the error.
                example: Gone
              message:
                type: string
                description: Any additional context on the error, or the same as `statusMessage` otherwise.
                example: Gone
    NotFoundError:
      description: The resource could not be located with the current API token.
      content:
        application/json:
          schema:
            description: An HTTP error resulting from an unsuccessful request.
            required:
            - statusCode
            - statusMessage
            - message
            additionalProperties: false
            properties:
              statusCode:
                type: number
                description: HTTP status code of the error.
                example: 404
              statusMessage:
                type: string
                description: HTTP status message of the error.
                example: Not Found
              message:
                type: string
                description: Any additional context on the error, or the same as `statusMessage` otherwise.
                example: Not Found
    UnauthorizedError:
      description: The API token is invalid or has expired.
      content:
        application/json:
          schema:
            description: An HTTP error resulting from an unsuccessful request.
            required:
            - statusCode
            - statusMessage
            - message
            additionalProperties: false
            properties:
              statusCode:
                type: number
                description: HTTP status code of the error.
                example: 401
              statusMessage:
                type: string
                description: HTTP status message of the error.
                example: Unauthorized
              message:
                type: string
                description: Any additional context on the error, or the same as `statusMessage` otherwise.
                example: Unauthorized
    TooManyRequestsError:
      description: The client has sent too many requests.
      content:
        application/json:
          schema:
            description: An HTTP error resulting from an unsuccessful request.
            required:
            - statusCode
            - statusMessage
            - message
            additionalProperties: false
            properties:
              statusCode:
                type: number
                description: HTTP status code of the error.
                example: 429
              statusMessage:
                type: string
                description: HTTP status message of the error.
                example: Too Many Requests
              message:
                type: string
                description: Any additional context on the error, or the same as `statusMessage` otherwise.
                example: Too Many Requests
    ForbiddenError:
      description: The API token does not grant access to this resource.
      content:
        application/json:
          schema:
            description: An HTTP error resulting from an unsuccessful request.
            required:
            - statusCode
            - statusMessage
            - message
            additionalProperties: false
            properties:
              statusCode:
                type: number
                description: HTTP status code of the error.
                example: 403
              statusMessage:
                type: string
                description: HTTP status message of the error.
                example: Forbidden
              message:
                type: string
                description: Any additional context on the error, or the same as `statusMessage` otherwise.
                example: Forbidden
    BadRequestError:
      description: The request parameters did not conform to expectations.
      content:
        application/json:
          schema:
            description: An HTTP error resulting from an unsuccessful request.
            required:
            - statusCode
            - statusMessage
            - message
            additionalProperties: false
            properties:
              statusCode:
                type: number
                description: HTTP status code of the error.
                example: 400
              statusMessage:
                type: string
                description: HTTP status message of the error.
                example: Bad Request
              message:
                type: string
                description: Any additional context on the error, or the same as `statusMessage` otherwise.
